    <circle cx="44.5" cy="154" r="12.5"/>
    <circle cx="44.5" cy="208.5" r="12.5"/>
    <circle cx="44.5" cy="263" r="12.5"/>
    <!-- column 3 -->
    <circle cx="99" cy="70" r="7"/>
